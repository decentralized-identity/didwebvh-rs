name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      # --tests + --examples covers the shipping code without tripping
      # the nightly-only did_benchmarks_nightly bench (uses #![feature(test)]).
      - run: cargo clippy --all-features --tests --examples -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  msrv:
    name: MSRV (1.95.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo install cargo-audit
      # Ignored advisories are ALL transitive via the optional `ssi`
      # feature; the default build has zero advisories. Reviewed and
      # confirmed still warranted on every CI run.
      #
      # Vulnerabilities (advisories with severity):
      # - RUSTSEC-2023-0071: rsa 0.6.1 Marvin Attack timing side-channel (via ssi-jwk)
      # - RUSTSEC-2026-0235: rkyv 0.7.46 out-of-bounds read validating an
      #   archive containing Rc/Arc. Reached only as
      #   byte-unit -> rust_decimal -> rkyv (rust_decimal's optional archive
      #   feature); nothing in this crate constructs or validates an rkyv
      #   archive, so the vulnerable code is never called. There is no
      #   non-breaking fix to take: the advisory's remedy is rkyv >= 0.8.17
      #   and rust_decimal 1.42.1 — the latest 1.x — still requires 0.7.46.
      #   Drop this the moment rust_decimal moves.
      #
      # Unmaintained warnings (no CVE, advisory category = "unmaintained"):
      # - RUSTSEC-2021-0127: serde_cbor unmaintained (via ssi-vc-jose-cose)
      # - RUSTSEC-2024-0370: proc-macro-error unmaintained (via linked-data-derive)
      # - RUSTSEC-2024-0388: derivative unmaintained (via ssi-jwk)
      #
      # The four reqwest 0.11-rooted entries (RUSTSEC-2026-0098/0099/0104
      # rustls-webpki, RUSTSEC-2025-0134 rustls-pemfile) were dropped when
      # this crate moved to reqwest 0.13 — that dep chain is gone and a
      # current audit no longer reports them. Do not re-add an --ignore
      # without confirming the advisory actually fires; stale ignores
      # silently mask the advisory if the dep ever returns.
      #
      # Re-audit when upstream `ssi` drops the affected dep chains
      # (all remaining entries are rooted in ssi-jwk / ssi-vc-jose-cose).
      - run: >-
          cargo audit
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0235
          --ignore RUSTSEC-2024-0388
          --ignore RUSTSEC-2024-0370
          --ignore RUSTSEC-2021-0127
